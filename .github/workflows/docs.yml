name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages is deployed from this workflow (no gh-pages branch).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The examples on the site run FTShadows, which calls stim and the decoders through PythonCall.
      - name: Python environment for the bridge
        run: |
          uv venv --python 3.12
          uv pip install -r python/requirements.txt
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Build the documentation
        env:
          JULIA_PYTHONCALL_EXE: ${{ github.workspace }}/.venv/bin/python
          JULIA_CONDAPKG_BACKEND: Null
        run: |
          julia --project=docs -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs docs/make.jl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
